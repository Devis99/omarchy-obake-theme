mode = "dark"

# Obake - paper lanterns over a koi pond at dusk, and the ghosts in them.
# Each value names the material it comes from; see DESIGN.md.
# Only the two colour families in the wallpapers: the lantern's warm light and the dusk's
# violet. Slot names are schema labels: 'red' is the koi, 'orange' the lantern, 'yellow' its
# glow, and green, cyan, blue and magenta are four lights of the same dusk.

accent               = "#fea22a"  # lantern
selection            = "#40356c"  # twilight
muted                = "#9d9ab9"  # mist
background           = "#1d1c3a"  # dusk
dark_background      = "#13122c"  # dusk_deep
darker_background    = "#0b0a20"  # dusk_deeper
lighter_background   = "#2b2a48"  # haze
foreground           = "#e3c697"  # paper
dark_foreground      = "#bea784"  # paper_dim
light_foreground     = "#f9e5c3"  # paper_hi
bright_foreground    = "#f9e5c3"  # paper_hi
selection_foreground = "#f9e5c3"  # paper_hi
selection_background = "#40356c"  # twilight
red                  = "#f56d2a"  # koi
orange               = "#fea22a"  # lantern
yellow               = "#ffc36a"  # glow
green                = "#c0abe7"  # onibi
cyan                 = "#cfccf1"  # moonmist
blue                 = "#9797d3"  # dusk_glow
magenta              = "#c098c2"  # robe
brown                = "#a3642a"  # wick
bright_red           = "#faa684"  # koi_hi
bright_yellow        = "#fedca7"  # glow_hi
bright_green         = "#daccf7"  # onibi_hi
bright_cyan          = "#e3e2f8"  # moonmist_hi
bright_blue          = "#b8b8ea"  # dusk_glow_hi
bright_magenta       = "#dcbbdd"  # robe_hi

# Unfocused windows sit back in the haze instead of Omarchy's neutral grey default.
hyprland_inactive_border = "rgba(2b2a4899)"  # haze
